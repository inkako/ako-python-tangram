[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wuchenghui", email = "chenghui.wu@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi[all]>=0.141.1",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
src = ["src"]
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "COM812"]
extend-select = ["UP006", "UP007", "UP035", "UP039", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
